apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: youtube-remote-config-pvc
  labels:
    app: youtube-remote
spec:
  accessModes:
  - ReadWriteOnce
  resources:
    requests:
      storage: 1Gi
  # Storage class (adjust based on your cluster)
  # storageClassName: standard
