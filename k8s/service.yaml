apiVersion: v1
kind: Service
metadata:
  name: youtube-remote-mcp
  labels:
    app: youtube-remote
    component: mcp-server
spec:
  type: ClusterIP
  selector:
    app: youtube-remote
    component: mcp-server
  ports:
  - name: mcp
    protocol: TCP
    port: 8080
    targetPort: 8080
  # Session affinity for stateful connections
  sessionAffinity: ClientIP
  sessionAffinityConfig:
    clientIP:
      timeoutSeconds: 10800  # 3 hours
